# Garmin → PostgreSQL on Mac mini.
# Start:        docker compose up -d --build
# Initial login:   docker compose run --rm collector python sync.py --login
# Logs:          tail -f logs/sync.log
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: garmin
      POSTGRES_USER: garmin
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      TZ: Europe/Moscow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"   # accessible only from the Mac mini itself (PyCharm, psql)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garmin -d garmin"]
      interval: 10s
      timeout: 5s
      retries: 10

  collector:
    build: ./collector
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Europe/Moscow
      PG_DSN: postgresql://garmin:${PG_PASSWORD}@postgres:5432/garmin
      RUN_TIMES: ${RUN_TIMES:-09:00,22:00}
      BACKFILL_FROM: ${BACKFILL_FROM:-}
      BACKFILL_DAYS_DEFAULT: ${BACKFILL_DAYS_DEFAULT:-90}
      RESYNC_DAYS: ${RESYNC_DAYS:-3}
      RUN_ON_START: ${RUN_ON_START:-1}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      KEEP_DUMPS: ${KEEP_DUMPS:-14}
      DOWNLOAD_FIT: ${DOWNLOAD_FIT:-1}
    volumes:
      - ./tokens:/tokens          # Garmin tokens (secret; do not publish)
      - ./out:/out                # CSV and FIT files for Google Drive
      - ./dumps:/dumps            # pg_dump after each run
      - ./logs:/logs
      - ./rclone:/config/rclone   # rclone configuration for Google Drive (secret)

volumes:
  pgdata:
